<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookstore</title>
    <!-- Add Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        /* Parallax Background */
        .parallax {
            background: url('https://via.placeholder.com/1920x500') no-repeat center center/cover;
            height: 300px;
        }

        /* Hero Section */
        .hero-section {
            background: #f8f9fa;
            padding: 20px 0;
            overflow: hidden;
            position: relative;
        }

        .hero-scroll {
            display: flex;
            gap: 20px;
            animation: scroll 10s linear infinite;
            will-change: transform;
        }

        .hero-item {
            min-width: 300px;
            height: 200px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease-in-out;
        }

        .hero-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-item:hover {
            transform: scale(1.1);
        }

        /* Horizontal Scrolling Animation */
        @keyframes scroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        .hero-scroll:hover {
            animation-play-state: paused;
        }

        /* Book Cards */
        .book-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .book-card:hover {
            transform: scale(1.05);
        }

        .book-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .book-card-body {
            padding: 15px;
            text-align: center;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 10px 0;
            background: #f1f1f1;
        }
    </style>
</head>
<body>

    <!-- Parallax Background Section -->
    <div class="parallax">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#">My Bookstore</a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Books</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'list_notes' %}">Notes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

    <!-- Hero Section -->
    <div class="hero-section">
        <div class="hero-scroll">
            <div class="hero-item">
                <img src="media/book_images/book1.webp" alt="Book 1">
            </div>
            <div class="hero-item">
                <img src="media/book_images/book2.jpg" alt="Book 2">
            </div>
            <div class="hero-item">
                <img src="media/book_images/book1.webp" alt="Book 3">
            </div>
            <div class="hero-item">
                <img src="media/book_images/book4.avif" alt="Book 4">
            </div>
            <div class="hero-item">
                <img src="media/book_images/book2.jpg" alt="Book 5">
            </div>
            <div class="hero-item">
                <img src="media/book_images/book4.avif" alt="Book 6">
            </div>
            <div class="hero-item">
                <img src="media/book_images/book1.webp" alt="Book 7">
            </div>
        </div>
    </div>

    <!-- Main Content Area: Books List -->
    <div class="container book-list">
        <h1 class="text-center my-5">Our Books</h1>
        <div class="row">
            {% for book in books %}
                <div class="col-md-4">
                    <div class="book-card">
                        <img src="{{ book.bk_image.url }}" alt="{{ book.bk_name }}">
                        <div class="book-card-body">
                            <h5>{{ book.bk_name }}</h5>
                            <p>{{ book.description }}</p>
                            <form method="POST" action="{% url 'delete_book' book.id %}">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this book?');">Delete</button>
                            </form>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

    <!-- Footer Section -->
    <footer class="footer">
        <p>&copy; 2025 My Bookstore | <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a></p>
    </footer>

    <!-- Add Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
