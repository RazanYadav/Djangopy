<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Note</title>
    <style>
        /* General Button Style */
        .btn-submit, .btn-back {
            padding: 10px 20px;
            font-size: 16px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        /* Hover effect for button */
        .btn-submit:hover {
            background-color: #2980b9;
            border-color: #2980b9;
            transform: scale(1.05);
        }

        /* Hover effect for the link */
        .btn-back:hover {
            background-color: #2ecc71;
            border-color: #2ecc71;
            color: white;
            transform: scale(1.05);
        }

        /* Optional: Add smooth transition */
        .btn-submit, .btn-back {
            transition: all 0.3s ease;
        }

        /* Additional styling for the form */
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        form button {
            margin-top: 20px;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Create Note</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit">Save</button>
    </form>
    <a href="{% url 'list_notes' %}" class="btn-back">Back to Notes</a>
</body>
</html>
