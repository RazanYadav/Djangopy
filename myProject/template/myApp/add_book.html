<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Books</title>
</head>
<body>
    <h1>Manage Books</h1>

    <!-- Add Book Form -->
    <h2>Add a New Book</h2>
    <form method="POST" action="{% url 'add_book' %}">
        {% csrf_token %}
        {{ add_book_form.as_p }}  <!-- Render form fields for adding a book -->
        <button type="submit">Add Book</button>
    </form>

    <hr>

    <!-- Book List with Update and Delete Actions -->
    <h2>Existing Books</h2>
    <div>
        {% for book in books %}
            <p><strong>Title:</strong> {{ book.bk_name }}</p>
            <p><strong>Number:</strong> {{ book.bk_number }}</p>

            <!-- Update Form -->
            <form method="GET" action="{% url 'update_book' book.id %}">
                <button type="submit">Update</button>
            </form>

            <!-- Delete Form -->
            <form method="POST" action="{% url 'delete_book' book.id %}">
                {% csrf_token %}
                <button type="submit" onclick="return confirm('Are you sure you want to delete this book?');">Delete</button>
            </form>
            <hr>
        {% endfor %}
    </div>
</body>
</html>
